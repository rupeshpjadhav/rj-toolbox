name: Deploy to Hostinger

# Flow: tests -> manual approval (production environment) -> build pushed to the
# `deploy` branch -> Hostinger Git auto-deployment publishes it to public_html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; never cancel one that is already publishing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Required reviewers on this environment are the "go live" approval.
    environment:
      name: production
      url: https://rj-toolkit.com
    permissions:
      contents: write # needed to push the build to the deploy branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check the build output
        run: test -f dist/index.html && test -f dist/favicon.svg && test -d dist/assets && test -f dist/sitemap.xml

      - name: Publish the build to the deploy branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WT="$RUNNER_TEMP/deploy-branch"
          rm -rf "$WT"
          if git ls-remote --exit-code --heads origin deploy >/dev/null 2>&1; then
            git fetch origin deploy:deploy
            git worktree add "$WT" deploy
          else
            git worktree add --orphan -b deploy "$WT"
          fi

          cd "$WT"
          git rm -rq --ignore-unmatch .
          cp -R "$GITHUB_WORKSPACE/dist/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Deploy branch already matches this build."
          else
            git commit -q -m "Deploy build of ${GITHUB_SHA:0:7}" -m "Built files only. Hostinger publishes this branch to public_html." -m "Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>"
            git push origin deploy
          fi

      - name: Wait until the live site serves this build
        run: |
          ASSET=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "Waiting for $ASSET on https://rj-toolkit.com/"
          for i in $(seq 1 40); do
            if curl -fsS "https://rj-toolkit.com/?v=$GITHUB_RUN_ID" | grep -q "$ASSET"; then
              echo "Live site is serving this build."
              exit 0
            fi
            sleep 15
          done
          echo "The live site did not show this build within 10 minutes."
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Live smoke test on https://rj-toolkit.com
        env:
          BASE_URL: https://rj-toolkit.com
        run: npx playwright test --grep @live --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
